app-id: io.github.lkaranl.ScreenShareServer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: screenshare-launcher

finish-args:
  # Rede: escutar nas portas 5000 (UDP/TCP) e 5001 (TCP)
  - --share=network
  - --share=ipc
  # Acesso total aos dispositivos de hardware (/dev/dri/card0, /dev/dri/renderD128, /dev/uinput)
  - --device=all
  # Interface gráfica e sockets de exibição (Wayland e X11)
  - --socket=wayland
  - --socket=fallback-x11
  # Diretório de runtime para PipeWire / Wayland
  - --filesystem=xdg-run/pipewire-0
  # Comunicação com bandeja do sistema e notificações
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/cargo

modules:
  - name: wl-clipboard
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb

  - name: screenshare-app
    buildsystem: simple
    build-commands:
      # Compilação de todos os componentes do workspace em Rust (release)
      - cargo build --release --workspace
      # Instalação dos binários do servidor, cliente e lançadores
      - install -Dm755 target/release/server /app/bin/server
      - install -Dm755 target/release/client-linux /app/bin/client-linux
      - install -Dm755 packaging/flatpak/screenshare-server-wrapper.sh /app/bin/screenshare-server-wrapper
      - install -Dm755 packaging/flatpak/screenshare-launcher.sh /app/bin/screenshare-launcher
      # Instalação de arquivos de desktop, metainfo e ícones
      - install -Dm644 packaging/flatpak/io.github.lkaranl.ScreenShareServer.desktop /app/share/applications/io.github.lkaranl.ScreenShareServer.desktop
      - install -Dm644 packaging/flatpak/io.github.lkaranl.ScreenShareServer.metainfo.xml /app/share/metainfo/io.github.lkaranl.ScreenShareServer.metainfo.xml
      # Instalação dos ícones em todas as resoluções padrão hicolor e SVG escalável
      - for size in 16 32 48 64 128 256 512; do install -Dm644 packaging/flatpak/icons/${size}x${size}.png /app/share/icons/hicolor/${size}x${size}/apps/io.github.lkaranl.ScreenShareServer.png; done
      - install -Dm644 packaging/flatpak/icons/io.github.lkaranl.ScreenShareServer.svg /app/share/icons/hicolor/scalable/apps/io.github.lkaranl.ScreenShareServer.svg
    sources:
      - type: dir
        path: ../../
