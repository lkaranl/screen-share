<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Monitor frame gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>

    <!-- Display active area gradient -->
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e66f5"/>
      <stop offset="50%" stop-color="#7287fd"/>
      <stop offset="100%" stop-color="#04a5e5"/>
    </linearGradient>

    <!-- Signal pulse gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Tile (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#45475a" stroke-width="6"/>

  <!-- Monitor Stand Base -->
  <path d="M 200 390 L 312 390 C 318 390 322 395 320 401 L 314 416 C 312 420 307 424 300 424 L 212 424 C 205 424 200 420 198 416 L 192 401 C 190 395 194 390 200 390 Z" fill="#45475a"/>
  <!-- Stand Neck -->
  <rect x="238" y="330" width="36" height="65" rx="6" fill="#313244"/>

  <!-- Monitor Frame -->
  <rect x="80" y="100" width="352" height="236" rx="24" fill="url(#screenGrad)" stroke="#585b70" stroke-width="4"/>

  <!-- Monitor Screen Area -->
  <rect x="94" y="114" width="324" height="208" rx="14" fill="url(#displayGrad)"/>

  <!-- Dynamic Content: Broadcast & Screen Share Waves -->
  <!-- Central cast/screen node -->
  <g transform="translate(256, 218)">
    <!-- Signal Wave 3 (Outer) -->
    <path d="M -90 -30 A 100 100 0 0 1 90 -30" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.35"/>
    <!-- Signal Wave 2 (Middle) -->
    <path d="M -60 -15 A 65 65 0 0 1 60 -15" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.65"/>
    <!-- Signal Wave 1 (Inner) -->
    <path d="M -30 0 A 32 32 0 0 1 30 0" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    <!-- Central Transmitter dot -->
    <circle cx="0" cy="18" r="16" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Status Active Badge (Bottom Right of screen) -->
  <circle cx="396" cy="300" r="12" fill="#a6e3a1" stroke="#181825" stroke-width="4" filter="url(#glow)"/>
</svg>
