[package]
name = "client-linux"
version = "0.1.0"
edition = "2021"
description = "Screen sharing client for Linux in Rust using SDL2 and low-latency UDP RTP/FEC"

[[bin]]
name = "client-linux"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Socket de rede de baixo nível para buffers ampliados e QoS DSCP
socket2 = "0.5"

# Multimídia (janela, textura GPU YUV streaming e captura de mouse/teclado)
sdl2 = { version = "0.37", default-features = false, features = ["use-pkgconfig"] }

# Serialização JSON (canal de controle TCP)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Buffers e bytes
byteorder = "1.5"
bytes = "1"

# Tratamento de erro e logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
